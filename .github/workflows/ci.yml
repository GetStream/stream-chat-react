name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master

env:
  BUILD_CACHE_KEY: ${{ github.sha }}-dist

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: { group: github-public-amd64 }
    name: ESLint, Prettier & Types
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node

      - run: yarn lint

      - name: Typecheck the library
        run: yarn types

      # scripts/ is outside the src tsconfigs and is not linted; Node 24 strips the types in
      # the .mts build scripts without checking them, so check them here.
      - name: Typecheck build scripts
        run: yarn types:scripts

  build:
    runs-on: { group: github-public-amd64 }
    permissions:
      actions: write
      contents: read
    name: Build & Validate
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node

      - run: yarn build

      - name: Validate CJS bundle with Node ${{ env.NODE_VERSION }}
        run: yarn validate-cjs

      - name: Validate ESM bundle with Node ${{ env.NODE_VERSION }}
        run: yarn validate-esm

      - name: Validate main entry does not pull in ai-components
        run: yarn validate-entry-isolation

      - name: Validate A2UI and OpenUI read no colour the AI tokens leave unset
        run: yarn validate-ai-ui-tokens

      - name: Validate translations are in sync with source
        # `yarn build` above already ran build-translations, which regenerates keys.ts from the
        # t() call sites and runtimeDefaults.ts. A diff here means the author changed a call site
        # without regenerating. Scoped to the one generated file so unrelated edits under
        # src/i18n (tests, Streami18n, runtimeDefaults) do not trip it.
        run: git diff --exit-code -- src/i18n/keys.ts

      - name: Build the example apps
        # Type-checks and bundles every `examples/*` workspace (vite, tutorial, ai-chatbot, ai-ui-gallery, cookbook) against
        # the `dist` built above, so an SDK change that breaks an example (or a stream-chat API one
        # relies on) fails here. None of the builds need Stream credentials.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: yarn examples:build

      - name: Cache Build Output
        uses: actions/cache@v5
        with:
          path: ./dist
          key: '${{ env.BUILD_CACHE_KEY }}'

  test:
    runs-on: { group: github-public-amd64 }
    name: Test
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node

      - name: Test with Node ${{ env.NODE_VERSION }}
        run: yarn coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          verbose: true
          use_oidc: true

  browser-test:
    # Pinned: Playwright installs Chromium only on the Ubuntu releases it supports, and
    # `ubuntu-latest` can move to one it does not support yet (26.04 did).
    runs-on: ubuntu-24.04
    name: Browser tests (virtualized lists)
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # Install scripts are disabled (`enableScripts: false`), so the browser is installed here.
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      # The shipped runtime: invariants, scenarios and fuzz seeds must pass.
      - name: Real-browser suites (react-virtuoso 4)
        run: yarn vitest run --project browser-v4

      # The react-virtuoso 2 reference and the trace comparison, recorded for review in the
      # artifact below and not gating: on CI's slower runners v2 loses races it is known for
      # (opening at the top, losing a jump), which local runs rarely hit. `yarn test:browser` runs
      # all three locally, the comparison gating there.
      - name: react-virtuoso 2 reference and trace comparison (informational)
        continue-on-error: true
        run: |
          yarn vitest run --project browser-v2 || true
          node scripts/compare-virtuoso-traces.mts

      - name: Upload the trace comparison
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: virtuoso-traces
          path: |
            .virtuoso-traces/report.md
            .virtuoso-traces/browser-v2
            .virtuoso-traces/browser-v4
          if-no-files-found: ignore

  deploy-vite-example:
    concurrency:
      cancel-in-progress: true
      # one deployment per PR, not commit
      group: "${{ github.base_ref || github.ref_name }}:${{ github.head_ref || 'nil' }}:${{matrix.projects.project-id}}"
    strategy:
      matrix:
        projects:
          - name: Vite Example Development
            project-id: prj_2Rq8kuNd0BmqKd2NwvkDjX9Htnx5
            stream-api-key: rq7ntdb4zzsq
          - name: Vite Example Public
            project-id: prj_yBYBe1AJV0tbpTqxCMzcyRfFWXxP
            stream-api-key: xzwhhgtazy6h
    runs-on: { group: github-public-amd64 }
    environment:
      name: "${{ matrix.projects.name }} (${{ github.ref_name == 'master' && 'Production' || 'Preview' }})"
      deployment: true
      url: '${{ steps.deploy-to-vercel.outputs.deploy-url }}'
    # skip if build fails
    needs:
      - build
    name: Deploy Vite Example to Vercel
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.projects.project-id }}
      VITE_STREAM_API_KEY: ${{ matrix.projects.stream-api-key }}
      NODE_ENV: production
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'master' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node
        env:
          NODE_ENV: ''

      - name: Recover Build Output
        id: build-cache
        uses: actions/cache@v5
        with:
          path: ./dist
          key: '${{ env.BUILD_CACHE_KEY }}'

      - name: Build SDK
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: yarn build

      - name: Vercel Pull/Build/Deploy
        working-directory: examples/vite
        id: deploy-to-vercel
        env:
          # "target=production" is not treated the same way "--prod" does
          PROD_FLAG: ${{ env.DEPLOY_ENVIRONMENT == 'production' && '--prod' || '' }}
        run: >-
          npx vercel pull --yes --environment=${{ env.DEPLOY_ENVIRONMENT }} --token=${{ secrets.VERCEL_TOKEN }} &&
          npx vercel build ${{ env.PROD_FLAG }} &&
          npx vercel deploy ${{ env.PROD_FLAG }} --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | 
          xargs -I % echo "deploy-url=%" >> "$GITHUB_OUTPUT"
